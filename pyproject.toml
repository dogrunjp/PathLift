[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pathlift"
version = "0.1.0"
description = "WikiPathways GPML をオーソログ解決で別種へ lift する CLI"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
pathlift = "pathlift.cli:main"

[tool.setuptools]
packages = ["pathlift"]
