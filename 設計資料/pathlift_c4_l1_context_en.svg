<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .sys{fill:#0F6E56;stroke:#0a4d3c;stroke-width:1.6}
    .person{fill:#dde7f0;stroke:#4a6b8a;stroke-width:1.3}
    .ext{fill:#eef0ef;stroke:#6b6b66;stroke-width:1.2}
    .extd{fill:#eef0ef;stroke:#6b6b66;stroke-width:1.2;stroke-dasharray:5 3}
    .th{font-size:13px;font-weight:600;fill:#23241f}
    .tw{font-size:14px;font-weight:600;fill:#ffffff}
    .ts{font-size:11px;fill:#54564e}
    .tsw{font-size:11px;fill:#cdebe2}
    .tag{font-size:9.5px;fill:#7a7a72}
    .tagw{font-size:9.5px;fill:#9fd4c6}
    .edge{fill:none;stroke:#8a8a82;stroke-width:1.3}
    .lbl{font-size:10.5px;fill:#5a5a52}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a8a82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="24" y="30" class="th" font-size="15">PathLift - C4 Level 1: System Context</text>

  <g>
    <circle cx="145" cy="62" r="13" class="person"/>
    <rect x="55" y="80" width="180" height="52" rx="9" class="person"/>
    <text x="145" y="98" text-anchor="middle" class="th">Researcher / Developer</text>
    <text x="145" y="116" text-anchor="middle" class="ts">Writes recipes, edits output</text>
    <text x="145" y="128" text-anchor="middle" class="tag">[Person]</text>
  </g>

  <g>
    <rect x="330" y="48" width="190" height="62" rx="9" class="ext"/>
    <text x="425" y="72" text-anchor="middle" class="th">WikiPathways</text>
    <text x="425" y="90" text-anchor="middle" class="ts">Source GPML provider</text>
    <text x="425" y="103" text-anchor="middle" class="tag">[External System]</text>
  </g>

  <g>
    <rect x="40" y="255" width="200" height="76" rx="9" class="ext"/>
    <text x="140" y="278" text-anchor="middle" class="th">External ortholog tables</text>
    <text x="140" y="296" text-anchor="middle" class="ts">FunFlow / FF4I</text>
    <text x="140" y="310" text-anchor="middle" class="ts">Third-party research outputs</text>
    <text x="140" y="324" text-anchor="middle" class="tag">[External System]</text>
  </g>

  <g>
    <rect x="40" y="460" width="200" height="68" rx="9" class="ext"/>
    <text x="140" y="484" text-anchor="middle" class="th">NCBI / Ensembl</text>
    <text x="140" y="502" text-anchor="middle" class="ts">gene_info / GTF</text>
    <text x="140" y="516" text-anchor="middle" class="tag">[External System]</text>
  </g>

  <g>
    <rect x="325" y="255" width="200" height="100" rx="11" class="sys"/>
    <text x="425" y="293" text-anchor="middle" class="tw">PathLift</text>
    <text x="425" y="314" text-anchor="middle" class="tsw">CLI that lifts GPML to</text>
    <text x="425" y="329" text-anchor="middle" class="tsw">another species via orthologs</text>
    <text x="425" y="345" text-anchor="middle" class="tagw">[Software System]</text>
  </g>

  <g>
    <rect x="600" y="240" width="195" height="86" rx="9" class="extd"/>
    <text x="697" y="264" text-anchor="middle" class="th">QPX notebook</text>
    <text x="697" y="282" text-anchor="middle" class="ts">Selects and visualizes candidates</text>
    <text x="697" y="296" text-anchor="middle" class="ts">using expression data</text>
    <text x="697" y="312" text-anchor="middle" class="tag">[External System]</text>
  </g>

  <g>
    <rect x="600" y="448" width="195" height="74" rx="9" class="ext"/>
    <text x="697" y="472" text-anchor="middle" class="th">PathVisio</text>
    <text x="697" y="490" text-anchor="middle" class="ts">Opens output GPML</text>
    <text x="697" y="503" text-anchor="middle" class="ts">for manual structure editing</text>
    <text x="697" y="516" text-anchor="middle" class="tag">[External System]</text>
  </g>

  <line x1="170" y1="132" x2="360" y2="256" class="edge" marker-end="url(#arr)"/>
  <text x="232" y="186" class="lbl">writes recipe / runs</text>

  <line x1="423" y1="110" x2="426" y2="253" class="edge" marker-end="url(#arr)"/>
  <text x="434" y="185" class="lbl">source GPML</text>

  <line x1="240" y1="290" x2="323" y2="298" class="edge" marker-end="url(#arr)"/>
  <text x="244" y="280" class="lbl">mapping tables</text>

  <line x1="240" y1="486" x2="345" y2="352" class="edge" marker-end="url(#arr)"/>
  <text x="246" y="430" class="lbl">gene_info / GTF</text>

  <line x1="525" y1="288" x2="598" y2="284" class="edge" marker-end="url(#arr)"/>
  <text x="560" y="270" text-anchor="middle" class="lbl">output GPML / extended TPM</text>

  <line x1="468" y1="355" x2="638" y2="450" class="edge" marker-end="url(#arr)"/>
  <text x="556" y="404" class="lbl">output GPML</text>
</svg>
