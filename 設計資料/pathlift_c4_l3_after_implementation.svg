<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .teal{fill:#e6f4f1;stroke:#0F6E56;stroke-width:1.2}
    .amber{fill:#fbf0dd;stroke:#9a6700;stroke-width:1.2}
    .gray{fill:#eef0ef;stroke:#6b6b66;stroke-width:1.2}
    .green{fill:#e7f5ea;stroke:#1f7a3d;stroke-width:1.2}
    .dash{stroke-dasharray:5 3}
    .th{font-size:13px;font-weight:600;fill:#23241f}
    .ts{font-size:11px;fill:#54564e}
    .edge{fill:none;stroke:#8a8a82;stroke-width:1.2}
    .edash{fill:none;stroke:#8a8a82;stroke-width:1.1;stroke-dasharray:4 3}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a8a82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="288" y="80" width="204" height="380" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="ts" x="296" y="96" text-anchor="start">PathLift (container)</text>

  <rect class="amber" x="300" y="20" width="180" height="44" rx="8"/>
  <text class="th" x="390" y="36" text-anchor="middle" dominant-baseline="central">liftover recipe</text>
  <text class="ts" x="390" y="52" text-anchor="middle" dominant-baseline="central">設定 + curation</text>
  <line class="edge" x1="390" y1="64" x2="390" y2="88" marker-end="url(#arrow)"/>

  <rect class="teal" x="300" y="90" width="180" height="42" rx="8"/>
  <text class="th" x="390" y="105" text-anchor="middle" dominant-baseline="central">①レシピローダ</text>
  <text class="ts" x="390" y="121" text-anchor="middle" dominant-baseline="central">検証→config</text>
  <line class="edge" x1="390" y1="132" x2="390" y2="154" marker-end="url(#arrow)"/>

  <rect class="teal" x="300" y="156" width="180" height="56" rx="8"/>
  <text class="th" x="390" y="176" text-anchor="middle" dominant-baseline="central">②パスウェイ変換器</text>
  <text class="ts" x="390" y="194" text-anchor="middle" dominant-baseline="central">GPML I/O・主導・展開</text>

  <rect class="gray" x="40" y="162" width="150" height="44" rx="8"/>
  <text class="th" x="115" y="178" text-anchor="middle" dominant-baseline="central">元GPML</text>
  <text class="ts" x="115" y="195" text-anchor="middle" dominant-baseline="central">ヒト・混在ns</text>
  <line class="edge" x1="190" y1="184" x2="298" y2="184" marker-end="url(#arrow)"/>
  <rect class="green" x="560" y="162" width="180" height="44" rx="8"/>
  <text class="th" x="650" y="178" text-anchor="middle" dominant-baseline="central">出力GPML</text>
  <text class="ts" x="650" y="195" text-anchor="middle" dominant-baseline="central">暫定:assembly</text>
  <line class="edge" x1="480" y1="184" x2="558" y2="184" marker-end="url(#arrow)"/>

  <line class="edge" x1="390" y1="212" x2="390" y2="242" marker-end="url(#arrow)"/>
  <text class="ts" x="406" y="230" text-anchor="start">resolve</text>

  <rect class="teal" x="300" y="242" width="180" height="56" rx="8"/>
  <text class="th" x="390" y="262" text-anchor="middle" dominant-baseline="central">③オーソログ解決器</text>
  <text class="ts" x="390" y="280" text-anchor="middle" dominant-baseline="central">複合ルート→候補集合</text>
  <rect class="gray" x="40" y="238" width="150" height="40" rx="8"/>
  <text class="th" x="115" y="258" text-anchor="middle" dominant-baseline="central">オーソログ表</text>
  <line class="edge" x1="190" y1="258" x2="298" y2="262" marker-end="url(#arrow)"/>
  <rect class="gray" x="40" y="286" width="150" height="38" rx="8"/>
  <text class="th" x="115" y="305" text-anchor="middle" dominant-baseline="central">gene_info</text>
  <line class="edge" x1="190" y1="303" x2="298" y2="290" marker-end="url(#arrow)"/>

  <line class="edge" x1="390" y1="298" x2="390" y2="326" marker-end="url(#arrow)"/>
  <text class="ts" x="406" y="314" text-anchor="start">uses</text>
  <rect class="teal" x="300" y="328" width="180" height="44" rx="8"/>
  <text class="th" x="390" y="344" text-anchor="middle" dominant-baseline="central">txgene (共有)</text>
  <text class="ts" x="390" y="361" text-anchor="middle" dominant-baseline="central">TranscriptGeneMap</text>
  <rect class="gray" x="40" y="330" width="150" height="40" rx="8"/>
  <text class="th" x="115" y="350" text-anchor="middle" dominant-baseline="central">GTF</text>
  <line class="edge" x1="190" y1="350" x2="298" y2="350" marker-end="url(#arrow)"/>

  <line class="edge" x1="390" y1="402" x2="390" y2="374" marker-end="url(#arrow)"/>
  <text class="ts" x="406" y="390" text-anchor="start">uses</text>
  <rect class="teal dash" x="300" y="402" width="180" height="48" rx="8"/>
  <text class="th" x="390" y="419" text-anchor="middle" dominant-baseline="central">④発現リンカ (未)</text>
  <text class="ts" x="390" y="437" text-anchor="middle" dominant-baseline="central">TPMにgene_id列</text>
  <rect class="gray" x="40" y="404" width="150" height="44" rx="8"/>
  <text class="th" x="115" y="426" text-anchor="middle" dominant-baseline="central">TPM</text>
  <line class="edge" x1="190" y1="426" x2="298" y2="426" marker-end="url(#arrow)"/>
  <rect class="green" x="540" y="402" width="160" height="46" rx="8"/>
  <text class="th" x="620" y="419" text-anchor="middle" dominant-baseline="central">拡張TPM</text>
  <text class="ts" x="620" y="437" text-anchor="middle" dominant-baseline="central">gene_id列付き</text>
  <line class="edge" x1="480" y1="426" x2="538" y2="426" marker-end="url(#arrow)"/>

  <rect class="gray dash" x="540" y="498" width="200" height="56" rx="8"/>
  <text class="th" x="640" y="518" text-anchor="middle" dominant-baseline="central">QPX notebook (PathLift外)</text>
  <text class="ts" x="640" y="537" text-anchor="middle" dominant-baseline="central">選別・可視化(選別の主役)</text>
  <path class="edash" d="M715 206 L715 496" marker-end="url(#arrow)"/>
  <path class="edash" d="M620 448 L620 496" marker-end="url(#arrow)"/>
</svg>
